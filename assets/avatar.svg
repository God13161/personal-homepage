<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="个人头像：蓝色渐变圆形，中间为白色汉字“李”">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="180" cy="180" r="180" fill="url(#bg)"/>
  <path d="M180 0a180 180 0 0 0-127.28 52.72L180 180Z" fill="url(#gloss)"/>
  <circle cx="180" cy="180" r="146" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"/>
  <text x="180" y="182" text-anchor="middle" dominant-baseline="central"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif"
        font-size="170" font-weight="700" fill="#ffffff">李</text>
</svg>
